name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            publish: pwsh ./publish.ps1 -Runtimes win-x64
          - os: macos-latest
            publish: ./publish.sh osx-arm64 osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test ArtGrader.slnx -c Release

      - name: Publish
        shell: bash
        run: ${{ matrix.publish }}

      - uses: actions/upload-artifact@v7
        with:
          name: ArtGrader-${{ runner.os }}
          path: artifacts/*.zip
          if-no-files-found: error

  # A tag v0.3 publishes the packages of this build on the GitHub release v0.3. The update check in ArtGrader reads these
  # releases, so the tag and the version in ArtGrader.Web.csproj must agree. Otherwise ArtGrader offers its own version
  # again and again.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the version
        shell: bash
        run: |
          version="$(grep -oP '(?<=<Version>)[^<]+' src/ArtGrader.Web/ArtGrader.Web.csproj)"
          tag="${GITHUB_REF_NAME#v}"
          normalize() { IFS=. read -r a b c <<< "$1"; echo "${a:-0}.${b:-0}.${c:-0}"; }
          if [[ "$(normalize "$tag")" != "$(normalize "$version")" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match <Version>$version</Version> in ArtGrader.Web.csproj." >&2
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish the packages on the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --prerelease --generate-notes --title "ArtGrader ${GITHUB_REF_NAME#v}"
          fi
          gh release upload "$GITHUB_REF_NAME" artifacts/*.zip --clobber
