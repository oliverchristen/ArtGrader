name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            publish: pwsh ./publish.ps1 -Runtimes win-x64
          - os: macos-latest
            publish: ./publish.sh osx-arm64 osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test ArtGrader.slnx -c Release

      - name: Publish
        shell: bash
        run: ${{ matrix.publish }}

      - uses: actions/upload-artifact@v4
        with:
          name: ArtGrader-${{ runner.os }}
          path: artifacts/*.zip
          if-no-files-found: error
